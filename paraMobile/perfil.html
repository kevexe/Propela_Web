<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Propela - Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Realistic Frosted Glass Refraction */
        .glass-refractive {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(25px) saturate(200%) contrast(90%);
            -webkit-backdrop-filter: blur(25px) saturate(200%) contrast(90%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px -10px rgba(31, 38, 135, 0.1), inset 0 0 20px rgba(255,255,255,0.2);
        }

        /* Crystalline Navigation Dock */
        .crystal-dock {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.5) 100%);
            backdrop-filter: blur(25px) brightness(1.1);
            -webkit-backdrop-filter: blur(25px) brightness(1.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
        }
        
        .crystal-dock::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.4) 45%, rgba(255,255,255,0.4) 55%, transparent 60%);
            pointer-events: none;
        }

        .action-button-glow {
            background: #ff6b00;
            box-shadow: 0 0 25px 5px rgba(255, 107, 0, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* High Fashion Typography */
        .tracking-fashion {
            letter-spacing: 0.05em;
        }

        /* Refraction Background Orbs */
        .color-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            z-index: 0;
            animation: float 15s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
            100% { transform: translate(-20px, 30px) scale(0.9); }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#ff6b00",
                        "on-surface": "#121c2a",
                        "background": "#f0f4fb",
                        "surface": "#ffffff"
                    },
                    "fontFamily": {
                        "sans": ["Inter", "sans-serif"]
                    },
                    "spacing": {
                        "margin-mobile": "20px"
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background font-sans antialiased selection:bg-primary/20 relative h-screen w-full overflow-hidden">
<!-- Dynamic Refraction Background -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="color-orb w-96 h-96 bg-[#ff6b00] top-[-10%] left-[-20%] mix-blend-multiply"></div>
<div class="color-orb w-80 h-80 bg-[#059eff] top-[20%] right-[-10%] mix-blend-multiply" style="animation-delay: -5s;"></div>
<div class="color-orb w-72 h-72 bg-[#9ccaff] bottom-[10%] left-[10%] mix-blend-multiply" style="animation-delay: -10s;"></div>
<div class="color-orb w-96 h-96 bg-[#ffdbcc] bottom-[-20%] right-[10%] mix-blend-multiply"></div>
<div class="absolute inset-0 bg-white/30 backdrop-blur-[40px]"></div>
</div>
<!-- Top Header -->
<header class="relative z-50 px-margin-mobile pt-12 pb-4 flex items-center justify-between">
<h1 class="text-2xl font-black tracking-fashion text-on-surface">Perfil</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full glass-refractive hover:bg-white/50 transition-all">
<span class="material-symbols-outlined text-on-surface text-[22px]">notifications</span>
</button>
</header>
<!-- Main Content Area -->
<main class="relative z-20 h-full w-full overflow-y-auto no-scrollbar px-margin-mobile pb-40">
<div class="max-w-lg mx-auto flex flex-col gap-6 items-center">
<!-- Avatar Section -->
<div class="relative mt-4">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-2xl transform scale-125"></div>
<div class="w-28 h-28 rounded-full overflow-hidden border-[3px] border-white/70 shadow-2xl relative z-10 glass-refractive p-1">
<img alt="Kevin Ramos" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUpESX3BvVsCWr7Sibiixk2foPxGYd9LVwHuHmZDfaNw4zE7Vz9W0Kg7NHhh0hDgNvBQ_lw8UoL5bDSsq4nJZycDsiZgzvRrgL84cw9syu7hOhbLLvGjpxet1Luuj_8Ku8eHoO7YRI7s-aMc8pajZbjiFiUZUfZSWf-G27_6e_40TV-XBK4YMChIhohAkdbfZi9ZN7jHtbbT9r9Xvk49oe8HVtC-sVsYhk-0rUV0MArBKV6jWKUDiSwQ"/>
</div>
</div>
<!-- User Info Card -->
<div class="glass-refractive w-full rounded-[32px] p-6 flex flex-col items-center gap-1 text-center">
<h2 class="text-xl font-black tracking-fashion text-on-surface">Kevin Ramos</h2>
<p class="text-sm font-medium text-on-surface/60 mb-4">@kevinramos</p>
<div class="flex items-center justify-center gap-8 w-full border-t border-white/40 pt-4">
<div class="flex flex-col items-center">
<span class="text-lg font-bold text-on-surface">12</span>
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface/60">Servicios</span>
</div>
<div class="w-px h-8 bg-white/40"></div>
<div class="flex flex-col items-center">
<span class="text-lg font-bold text-on-surface">4.9</span>
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface/60">Rating</span>
</div>
</div>
</div>
<!-- Menu List -->
<div class="glass-refractive w-full rounded-[32px] p-2 flex flex-col gap-1">
<!-- Mi Cuenta -->
<button class="flex items-center justify-between w-full p-4 rounded-3xl hover:bg-white/30 active:bg-white/40 transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-white/50 flex items-center justify-center shadow-inner group-hover:bg-white/70 transition-colors">
<span class="material-symbols-outlined text-[20px] text-on-surface">person</span>
</div>
<span class="text-sm font-bold text-on-surface tracking-wide">Mi Cuenta</span>
</div>
<span class="material-symbols-outlined text-on-surface/50">chevron_right</span>
</button>
<!-- Seguridad -->
<button class="flex items-center justify-between w-full p-4 rounded-3xl hover:bg-white/30 active:bg-white/40 transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-white/50 flex items-center justify-center shadow-inner group-hover:bg-white/70 transition-colors">
<span class="material-symbols-outlined text-[20px] text-on-surface">shield</span>
</div>
<span class="text-sm font-bold text-on-surface tracking-wide">Seguridad</span>
</div>
<span class="material-symbols-outlined text-on-surface/50">chevron_right</span>
</button>
<!-- Soporte -->
<button class="flex items-center justify-between w-full p-4 rounded-3xl hover:bg-white/30 active:bg-white/40 transition-colors group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-white/50 flex items-center justify-center shadow-inner group-hover:bg-white/70 transition-colors">
<span class="material-symbols-outlined text-[20px] text-on-surface">support_agent</span>
</div>
<span class="text-sm font-bold text-on-surface tracking-wide">Soporte</span>
</div>
<span class="material-symbols-outlined text-on-surface/50">chevron_right</span>
</button>
</div>
<!-- Logout Button -->
<button class="glass-refractive w-full py-4 rounded-[24px] text-error font-bold tracking-fashion uppercase text-xs active:scale-95 transition-transform mt-2 mb-8 border-error/20 bg-error/5">
                Cerrar Sesión
            </button>
</div>
</main>
<!-- Floating Crystalline Dock -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-[60]">
<div class="crystal-dock px-2 py-2 flex items-center justify-between shadow-2xl">
<button class="flex-1 flex flex-col items-center justify-center gap-1 opacity-50 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[24px]">house</span>
<span class="text-[8px] font-black uppercase tracking-fashion">Home</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center gap-1 opacity-50 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[24px]">explore</span>
<span class="text-[8px] font-black uppercase tracking-fashion">Explore</span>
</button>
<!-- Central Action Button -->
<div class="relative -top-3">
<button class="action-button-glow w-16 h-16 rounded-full flex items-center justify-center text-white border-2 border-white/30 transform hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[32px] font-light">add</span>
</button>
</div>
<button class="flex-1 flex flex-col items-center justify-center gap-1 opacity-50 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[24px]">message</span>
<span class="text-[8px] font-black uppercase tracking-fashion">Inbox</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center gap-1 opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">account_circle</span>
<span class="text-[8px] font-black uppercase tracking-fashion">Profile</span>
</button>
</div>
</nav>
<script>
        // Interaction logic for glass cards
        document.querySelectorAll('.glass-refractive').forEach(card => {
            if(card.tagName.toLowerCase() !== 'button') return;
            card.addEventListener('mousedown', () => {
                card.style.transform = 'scale(0.97)';
                card.style.backdropFilter = 'blur(15px) saturate(220%) brightness(0.9)';
            });
            card.addEventListener('mouseup', () => {
                card.style.transform = 'scale(1)';
                card.style.backdropFilter = 'blur(25px) saturate(200%) contrast(90%)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'scale(1)';
                card.style.backdropFilter = 'blur(25px) saturate(200%) contrast(90%)';
            });
        });
    </script>
</body></html>
