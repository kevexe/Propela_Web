<html class="light" lang="en"><head>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .glass-high-gloss {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .diamond-dock {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
        }
        .diamond-dock::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.2) 100%);
            pointer-events: none;
        }
        /* Faceted glass refraction simulation */
        .facet {
            position: absolute;
            background: linear-gradient(45deg, rgba(255,255,255,0.2), transparent);
            pointer-events: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .map-silver {
            filter: grayscale(100%) brightness(1.05) contrast(0.9);
        }
        .glow-orange {
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.4);
        }
        .gem-center {
            background: radial-gradient(circle at 30% 30%, #ff8c33, #ff6b00 70%, #cc5600);
            box-shadow: 0 0 25px rgba(255, 107, 0, 0.6), inset 0 0 10px rgba(255,255,255,0.5);
            border: 2px solid rgba(255,255,255,0.4);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {

                extend: {

                        "secondary": "#555f70",
                        "background": "#f8f9ff",

<script>
        // Micro-interaction for expert cards
        const cards = document.querySelectorAll('.snap-start');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                card.style.transform = 'scale(0.98) translateY(2px)';
                setTimeout(() => {
                    card.style.transform = 'scale(1) translateY(0)';
                }, 150);
            });
        });
    </script>
